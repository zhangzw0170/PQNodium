[package]
name = "pqnodium-gui"
version = "0.3.0"
edition = "2021"
description = "PQNodium — Post-Quantum Decentralized Messaging (Slint GUI)"
build = "build.rs"

[dependencies]
pqnodium-core = { path = "../pqnodium-core" }
pqnodium-p2p = { path = "../pqnodium-p2p" }
slint = "1.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[build-dependencies]
slint-build = "1.16"
